# This workflow is a work in progress and is not yet fully functional. 
# It is intended to run pre-flight checks on the repository to ensure that the code is in a good state before merging.

name: Terraform Tests

on:
  push:
    branches:
      - Pre-Check-Improvements

  pull_request:
    branches:
      - main

jobs:
  terraform-tests:
    name: Terraform Validation Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Lab12

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform Version
        run: terraform version

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # The root-level *-check.tf files validate relationships that may depend on AWS values
      # that are only known AFTER apply (for example, generated API Gateway IDs). During
      # terraform test, those checks are still loaded with the root module and can cause
      # plan-time tests to fail even when the tests themselves are valid. We temporarily
      # move the check files out of the module so validations.tftest.hcl can run as an
      # isolated pre-flight test suite, then restore the checks afterward for local/apply use.
      - name: Isolate Terraform Checks
        run: |
          mkdir -p /tmp/terraform-checks
          mv *-check.tf /tmp/terraform-checks/

      - name: Terraform Test
        run: terraform test -filter=tests/validations.tftest.hcl

      # if: always() is a GitHub Actions conditional. It tells this restore step to run
      # even if the Terraform Test step fails, so the temporarily moved *-check.tf files
      # are put back before the job finishes.
      - name: Restore Terraform Checks
        if: always()
        run: |
          mv /tmp/terraform-checks/*-check.tf .